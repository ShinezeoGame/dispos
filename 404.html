<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable · AllReady</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#110f0e">
  <!-- La couleur choisie par le visiteur, appliquée avant l'affichage
       (js/theme.js) : doit rester ici, avant tout le reste. -->
  <script src="/js/theme.js"></script>
  <!-- Ici, apparence.js ne fait que colorer l'icône de l'onglet aux
       couleurs du thème choisi (la page n'a pas de palette). -->
  <script type="module" src="/js/apparence.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Cloudflare sert ce fichier tout seul, avec le code 404, pour
       toute adresse qui ne correspond à aucune page. -->
  <header class="entete-accueil">
    <!-- Le logo (même dessin que dans index.html, voir l'explication là-bas). -->
    <a class="logo" href="/">
      <svg class="logo-icone" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <path class="logo-trait" d="M12.5 33.5 26 47 53 18" pathLength="1"/>
        <circle cx="12.5" cy="33.5" r="5.5"/><circle cx="26" cy="47" r="5.5"/><circle cx="39.5" cy="32.5" r="5.5"/><circle cx="53" cy="18" r="5.5"/>
      </svg>
      <span class="logo-texte">All<span class="logo-ready">Ready</span></span>
    </a>
  </header>
  <main class="accueil">
    <section class="message-centre">
      <h1>Personne n'est dispo ici.</h1>
      <p>Cette page n'existe pas.</p>
      <a class="bouton" href="/">Retour à l'accueil</a>
    </section>
  </main>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- L'icône d'onglet : le logo d'AllReady (une coche dessinée par
       quatre ronds, les joueurs de la team, reliés par un trait plein)
       sur un carré anthracite. Mêmes coordonnées que dans les pages
       HTML, un peu resserrées vers le centre pour laisser une marge.
       Trait et ronds un peu plus épais que dans l'en-tête : une icône
       d'onglet s'affiche en 16 pixels, un trait fin y disparaîtrait. -->
  <rect width="64" height="64" rx="14" fill="#110f0e"/>
  <g transform="translate(32 32) scale(0.8) translate(-32 -32.5)">
    <path d="M12.5 33.5 26 47 53 18" fill="none" stroke="#ff7a3d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ff7a3d">
      <circle cx="12.5" cy="33.5" r="7"/>
      <circle cx="26" cy="47" r="7"/>
      <circle cx="39.5" cy="32.5" r="7"/>
      <circle cx="53" cy="18" r="7"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- L'icône d'onglet : le logo d'AllReady (une coche dessinée par
       quatre ronds, les joueurs de la team) sur un carré anthracite.
       Mêmes coordonnées que dans les pages HTML, un peu resserrées
       vers le centre pour laisser une marge au carré. -->
  <rect width="64" height="64" rx="14" fill="#110f0e"/>
  <g transform="translate(32 32) scale(0.78) translate(-32 -32.5)">
    <path d="M12.5 33.5 26 47 53 18" fill="none" stroke="#ff7a3d" stroke-opacity=".45" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ff7a3d">
      <circle cx="12.5" cy="33.5" r="8"/>
      <circle cx="26" cy="47" r="8"/>
      <circle cx="39.5" cy="32.5" r="8"/>
      <circle cx="53" cy="18" r="8"/>
    </g>
  </g>
</svg>

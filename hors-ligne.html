<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pas de connexion · AllReady</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#110f0e">
  <!-- LA PAGE « PAS DE CONNEXION » (mode appli, 6 nov. 2026). Le
       service worker (sw.js) la garde dès sa première visite et la
       montre quand une page est demandée sans réseau et qu'aucune copie
       n'existe encore (un groupe jamais ouvert, par exemple). Elle ne
       charge que ce qu'il garde avec elle : le style, les polices, la
       couleur choisie (js/theme.js). -->
  <script src="/js/theme.js"></script>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="entete-accueil">
    <!-- Le logo (même dessin que dans index.html, voir l'explication là-bas). -->
    <a class="logo" href="/">
      <svg class="logo-icone" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <path class="logo-trait" d="M12.5 33.5 26 47 53 18" pathLength="1"/>
        <circle cx="12.5" cy="33.5" r="5.5"/><circle cx="26" cy="47" r="5.5"/><circle cx="39.5" cy="32.5" r="5.5"/><circle cx="53" cy="18" r="5.5"/>
      </svg>
      <span class="logo-texte">All<span class="logo-ready">Ready</span></span>
    </a>
  </header>
  <main class="accueil">
    <section class="message-centre">
      <h1>Pas de connexion.</h1>
      <p>AllReady s'ouvrira dès que le réseau sera revenu.</p>
      <!-- Un simple lien : sans réseau, il ramène ici ; avec, il ouvre l'appli. -->
      <a class="bouton" href="/">Réessayer</a>
    </section>
  </main>
</body>
</html>
